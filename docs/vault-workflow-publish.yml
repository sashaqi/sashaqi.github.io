# Copy this file into the VAULT repo (sashaqi/obsidian-stardust) at
#   .github/workflows/publish.yml
# It does not belong in the site repo. See docs/SETUP.md step 4.

name: Publish to website

on:
  push:
    branches: [main]
    paths:
      - "05-Public/**"
      - "Assets/**"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site rebuild
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sashaqi/sashaqi.github.io/dispatches \
            -d '{"event_type":"vault-updated"}'

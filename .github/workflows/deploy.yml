name: Build and deploy site

on:
  # Changes to the site itself (theme, config, sync script).
  push:
    branches: [main]
  # Fired by the vault repo when 05-Public changes. See docs/SETUP.md.
  repository_dispatch:
    types: [vault-updated]
  # Backstop, in case a dispatch is ever missed.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a cancelled run would drop a just-published post.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.164.0"
  VAULT_REPO: sashaqi/obsidian-stardust

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Only 05-Public and Assets are pulled. Private vault folders are never
      # fetched onto the runner at all.
      - name: Checkout vault content
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VAULT_REPO }}
          token: ${{ secrets.VAULT_TOKEN }}
          path: .vault
          sparse-checkout: |
            05-Public
            Assets
          sparse-checkout-cone-mode: false

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Sync vault into content/
        run: python3 scripts/sync_vault.py --vault .vault

      - name: Build
        run: hugo --minify --gc

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
